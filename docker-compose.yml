services:
  ingatlan:
    build:
      context: ./gmail-watcher
      dockerfile: Dockerfile
    image: ingatlan-watcher:latest
    container_name: ix-ingatlan
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?add meg a .env fajlban}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?add meg a .env fajlban}
      OLLAMA_URL: ${OLLAMA_URL:?add meg a .env fajlban}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m3:cloud}
      DATA_DIR: /app/data
      DB_HOST: ${DB_HOST:?add meg a .env fajlban}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-ingatlan}
      DB_PASSWORD: ${DB_PASSWORD:?add meg a .env fajlban}
      DB_NAME: ${DB_NAME:-ingatlan}
    volumes:
      - ${INGATLAN_DATA:?add meg a .env fajlban}/client_secret.json:/app/ingatlan/client_secret.json:ro
      - ${INGATLAN_DATA:?add meg a .env fajlban}/token.pickle:/app/ingatlan/token.pickle
      - ${INGATLAN_DATA:?add meg a .env fajlban}/state.json:/app/ingatlan/state.json
      - ${INGATLAN_DATA:?add meg a .env fajlban}:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: ingatlan-dashboard:latest
    container_name: ix-ingatlan-dashboard
    ports:
      - "5000:5000"
    environment:
      DATA_DIR: /app/data
      FLASK_DEBUG: "0"
      OLLAMA_URL: ${OLLAMA_URL:?add meg a .env fajlban}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m3:cloud}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DB_HOST: ${DB_HOST:?add meg a .env fajlban}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-ingatlan}
      DB_PASSWORD: ${DB_PASSWORD:?add meg a .env fajlban}
      DB_NAME: ${DB_NAME:-ingatlan}
    volumes:
      - ${INGATLAN_DATA:?add meg a .env fajlban}:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Debug service-ek -- csak explicit inditasra (docker compose --profile debug run ...)
  simple-check:
    profiles: ["debug"]
    image: ingatlan-watcher:latest
    container_name: ix-simple-check
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?add meg a .env fajlban}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?add meg a .env fajlban}
      OLLAMA_URL: ${OLLAMA_URL:?add meg a .env fajlban}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m3:cloud}
      DATA_DIR: /app/data
    volumes:
      - ${INGATLAN_DATA:?add meg a .env fajlban}/client_secret.json:/app/ingatlan/client_secret.json:ro
      - ${INGATLAN_DATA:?add meg a .env fajlban}/token.pickle:/app/ingatlan/token.pickle
      - ${INGATLAN_DATA:?add meg a .env fajlban}/state.json:/app/ingatlan/state.json
      - ${INGATLAN_DATA:?add meg a .env fajlban}:/app/data
    restart: "no"
    entrypoint: ["python"]
    command: ["simple_check.py"]

  detailed-check:
    profiles: ["debug"]
    image: ingatlan-watcher:latest
    container_name: ix-detailed-check
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?add meg a .env fajlban}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?add meg a .env fajlban}
      OLLAMA_URL: ${OLLAMA_URL:?add meg a .env fajlban}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m3:cloud}
      DATA_DIR: /app/data
    volumes:
      - ${INGATLAN_DATA:?add meg a .env fajlban}/client_secret.json:/app/ingatlan/client_secret.json:ro
      - ${INGATLAN_DATA:?add meg a .env fajlban}/token.pickle:/app/ingatlan/token.pickle
      - ${INGATLAN_DATA:?add meg a .env fajlban}/state.json:/app/ingatlan/state.json
      - ${INGATLAN_DATA:?add meg a .env fajlban}:/app/data
    restart: "no"
    entrypoint: ["python"]
    command: ["detailed_check.py"]

  debug-24h:
    profiles: ["debug"]
    image: ingatlan-watcher:latest
    container_name: ix-debug-24h
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?add meg a .env fajlban}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?add meg a .env fajlban}
      OLLAMA_URL: ${OLLAMA_URL:?add meg a .env fajlban}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m3:cloud}
      DATA_DIR: /app/data
    volumes:
      - ${INGATLAN_DATA:?add meg a .env fajlban}/client_secret.json:/app/ingatlan/client_secret.json:ro
      - ${INGATLAN_DATA:?add meg a .env fajlban}/token.pickle:/app/ingatlan/token.pickle
      - ${INGATLAN_DATA:?add meg a .env fajlban}/state.json:/app/ingatlan/state.json
      - ${INGATLAN_DATA:?add meg a .env fajlban}:/app/data
    restart: "no"
    entrypoint: ["python"]
    command: ["debug_24h.py"]
